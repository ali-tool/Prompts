<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <!-- وصف الموقع وكلمات مفتاحية لمحركات البحث -->
    <meta name="description" content="مكتبة برومبتات مجانية واحترافية للمبرمجين، صانعي المحتوى، مطوري الأندرويد، وخبراء الأمن السيبراني.">
    <meta name="keywords" content="Prompt Library, C++, Python, Android, Cybersecurity, Prompts, برومبتات">
    <meta name="author" content="Ali Tool">
    <meta name="google-site-verification" content="YJmVnssUpCxa3S367Hy25ipXBhZt7fdUdPXgjQrxZBQ" />
    <!-- لتحسين ظهور الموقع على وسائل التواصل الاجتماعي (Open Graph) -->
    <meta property="og:title" content="مكتبة البرومبتات الذكية | مكتبة الأوامر الاحترافية">
    <meta property="og:description" content="آلاف الأوامر المخبأة لتطوير وتصميم ومساعدة المبرمجين مجاناً.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ali-tool.github.io/mY/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Prompts Platform | Professional Command Library</title>
    <!-- استيراد خط أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
        header { text-align: center; margin: 40px 0; }
        header h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 10px; }
        header p { color: #94a3b8; }
        .search-container { max-width: 600px; margin: 0 auto 40px auto; }
        .search-container input { width: 100%; padding: 15px 20px; font-size: 1rem; border-radius: 12px; border: 1px solid #334155; background-color: #1e293b; color: #fff; outline: none; transition: 0.3s; }
        .search-container input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .card h3 { color: #e2e8f0; margin-bottom: 10px; font-size: 1.2rem; }
        .card span.tag { display: inline-block; background: #0369a1; color: #e0f2fe; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 10px; width: fit-content; }
        .card p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px; }
        .prompt-box { background: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #38bdf8; margin-bottom: 15px; max-height: 80px; overflow-y: auto; direction: ltr; text-align: left; }
        .copy-btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; }
        .copy-btn:hover { background-color: #0ea5e9; }
        .copied { background-color: #22c55e !important; color: #fff !important; }
    </style>
</head>
<body>

    <header>
        
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Look for Prompt (e.g., C++, 3D, Android)..." onkeyup="filterPrompts()">
    </div>

    <div class="grid" id="promptsGrid">
        <!-- سيتم تعبئة الكروت تلقائياً عبر الجافاسكريبت -->
    </div>

    <script>
        let allPrompts = [];

        // جلب البيانات من ملف JSON عند فتح الصفحة
        fetch('prompts.json')
            .then(response => response.json())
            .then(data => {
                allPrompts = data;
                displayPrompts(allPrompts);
            })
            .catch(error => console.error('Data loading error:', error));

        function displayPrompts(prompts) {
            const grid = document.getElementById('promptsGrid');
            grid.innerHTML = '';

            if (prompts.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #94a3b8; grid-column: 1/-1;">لا توجد نتائج مطابقة لبحثك.</p>';
                return;
            }

            prompts.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <span class="tag">${item.category}</span>
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <div class="prompt-box" id="prompt-${item.id}">${item.promptText}</div>
                    </div>
                    <button class="copy-btn" onclick="copyPrompt('prompt-${item.id}', this)">cope</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterPrompts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPrompts.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.description.toLowerCase().includes(query) || 
                item.category.toLowerCase().includes(query) ||
                item.promptText.toLowerCase().includes(query)
            );
            displayPrompts(filtered);
        }

        // دالة نسخ تعتمد على قراءة النص من العنصر مباشرة (تمنع أي أخطاء)
        function copyPrompt(elementId, button) {
            const promptElement = document.getElementById(elementId);
            if (!promptElement) return;

            const textToCopy = promptElement.innerText || promptElement.textContent;

            navigator.clipboard.writeText(textToCopy).then(() => {
                button.textContent = 'Copied successfully! ✓';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Prompt Copy';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Copying failed:', err);
            });
        }
    </script>
</body>
</html>
